function loadLocal(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function saveLocal(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

async function fetchGist(token, gistId) {
  const r = await fetch(`https://api.github.com/gists/${gistId}`, {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (!r.ok) throw new Error('Gist 불러오기 실패');
  const d = await r.json();
  const file = d.files['pension_data.json'];
  if (!file) throw new Error('pension_data.json 파일 없음');
  return JSON.parse(file.content);
}

async function saveGist(token, gistId, data) {
  const body = { files: { 'pension_data.json': { content: JSON.stringify(data, null, 2) } } };
  if (gistId) {
    const r = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH', headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('Gist 저장 실패');
    return gistId;
  } else {
    const r = await fetch('https://api.github.com/gists', {
      method: 'POST', headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: '연금·ISA 포트폴리오 데이터', public: false, ...body })
    });
    if (!r.ok) throw new Error('Gist 생성 실패');
    const d = await r.json();
    return d.id;
  }
}

function EditModal({ account, onSave, onClose }) {
  const [etfs, setEtfs] = useState(account.etfs.map(e => ({...e})));
  const [monthly, setMonthly] = useState(account.monthly);
  const total = etfs.reduce((s, e) => s + Number(e.ratio || 0), 0);

  const update = (i, key, val) => setEtfs(prev => prev.map((e, j) => j === i ? {...e, [key]: key === 'ratio' || key === 'monthly' ? Number(val) : val} : e));

  const handleSave = () => {
    const updated = etfs.map(e => ({...e, monthly: Math.round(monthly * e.ratio / 100)}));
    onSave({...account, monthly: Number(monthly), etfs: updated});
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="card card-glow w-full max-w-2xl max-h-screen overflow-y-auto p-6">
        <div className="flex items-center justify-between mb-5">
          <h2 className="text-lg font-bold text-white">{account.name} 포트폴리오 편집</h2>
          <button onClick={onClose} className="text-gray-500 hover:text-white text-xl">✕</button>
        </div>
        <div className="mb-4">
          <label className="text-xs text-gray-500 block mb-1">월 납입액 (원)</label>
          <input type="number" value={monthly} onChange={e => setMonthly(e.target.value)} className="price-input w-48" />
        </div>
        <div className="space-y-3 mb-5">
          {etfs.map((etf, i) => (
            <div key={i} className="bg-gray-950 border border-gray-800 rounded-lg p-3 space-y-2">
              <div className="flex items-center gap-2 text-sm font-medium text-white">
                <span className="text-gray-500 w-4">{i+1}</span>
                <input value={etf.name} onChange={e => update(i, 'name', e.target.value)} className="bg-transparent border-b border-gray-700 focus:border-amber-500 outline-none text-white flex-1 px-1" />
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="text-xs text-gray-500">코드</label>
                  <input value={etf.code} onChange={e => update(i, 'code', e.target.value)} className="price-input text-left mt-0.5" />
                </div>
                <div>
                  <label className="text-xs text-gray-500">운용사</label>
                  <input value={etf.company} onChange={e => update(i, 'company', e.target.value)} className="price-input text-left mt-0.5" />
                </div>
                <div>
                  <label className="text-xs text-gray-500">비중(%)</label>
                  <input type="number" value={etf.ratio} onChange={e => update(i, 'ratio', e.target.value)} className="price-input mt-0.5" />
                </div>
              </div>
              <div>
                <label className="text-xs text-gray-500">역할·투자포인트</label>
                <input value={etf.role} onChange={e => update(i, 'role', e.target.value)} className="price-input text-left mt-0.5" />
              </div>
            </div>
          ))}
        </div>
        <div className={`text-sm mb-4 ${Math.abs(total - 100) < 0.1 ? 'text-green-400' : 'text-red-400'}`}>
          비중 합계: {total}% {Math.abs(total - 100) > 0.1 ? '(100%가 되어야 합니다)' : '✓'}

        <div className="flex gap-3">
          <button onClick={handleSave} disabled={Math.abs(total-100) > 0.1} className="flex-1 py-2.5 rounded-lg font-semibold text-black gold-bg disabled:opacity-40">저장</button>

const TABS = [
  { id: 'dashboard', label: '📊 대시보드' },
  { id: 'pension1', label: '개인연금 1' },
  { id: 'pension2', label: '개인연금 2' },
  { id: 'irp', label: 'IRP' },
  { id: 'isa', label: 'ISA' },
];

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');
  const [data, setData] = useState(() => loadLocal(DATA_KEY, INITIAL_DATA));
  const [prices, setPrices] = useState(() => loadLocal(PRICE_KEY, {}));
  const [gistConfig, setGistConfig] = useState(() => loadLocal(GIST_KEY, {}));
  const [showSettings, setShowSettings] = useState(false);
  const [editAccount, setEditAccount] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [syncStatus, setSyncStatus] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(() => { saveLocal(DATA_KEY, data); }, [data]);
  useEffect(() => { saveLocal(PRICE_KEY, prices); }, [prices]);

  const handlePriceChange = useCallback((code, val) => {
    setPrices(prev => ({...prev, [code]: Number(val) || 0}));
  }, []);

  const handleSaveGist = async () => {
    if (!gistConfig.token) { setShowSettings(true); return; }
    setSaving(true);
    setSyncStatus({type: 'info', msg: 'Gist에 저장 중...'});
    try {
      const payload = { data, prices, savedAt: new Date().toISOString() };
      const newId = await saveGist(gistConfig.token, gistConfig.gistId, payload);
      if (newId !== gistConfig.gistId) {
        const nc = {...gistConfig, gistId: newId};
        setGistConfig(nc); saveLocal(GIST_KEY, nc);
      }
      setSyncStatus({type: 'success', msg: `✓ Gist 저장 완료 (ID: ${newId.slice(0,8)}...)`});
    } catch(e) { setSyncStatus({type: 'error', msg: '저장 실패: ' + e.message}); }
    setSaving(false);
    setTimeout(() => setSyncStatus(null), 4000);
  };

  const handleLoadGist = async (token, gistId) => {
    if (!gistId) { setSyncStatus({type: 'error', msg: 'Gist ID를 먼저 입력해주세요.'}); return; }
    setSyncStatus({type: 'info', msg: 'Gist에서 불러오는 중...'});
    try {
      const payload = await fetchGist(token, gistId);
      if (payload.data) { setData(payload.data); saveLocal(DATA_KEY, payload.data); }
      if (payload.prices) { setPrices(payload.prices); saveLocal(PRICE_KEY, payload.prices); }
      setSyncStatus({type: 'success', msg: `✓ 동기화 완료 (${payload.savedAt ? new Date(payload.savedAt).toLocaleString('ko-KR') : ''})`});
    } catch(e) { setSyncStatus({type: 'error', msg: '불러오기 실패: ' + e.message}); }
  };

  const handleSaveSettings = (cfg) => {
    setGistConfig(cfg); saveLocal(GIST_KEY, cfg);
    setSyncStatus({type: 'success', msg: '설정이 저장되었습니다.'});
    setShowSettings(false);
    setTimeout(() => setSyncStatus(null), 3000);
  };

  const handleEditSave = (updated) => {
    setData(prev => ({...prev, accounts: prev.accounts.map(a => a.id === updated.id ? updated : a)}));
    setEditAccount(null);
  };

  const handleReset = () => {
    if (confirm('포트폴리오를 초기값으로 되돌리시겠습니까?')) { setData(INITIAL_DATA); saveLocal(DATA_KEY, INITIAL_DATA); }
  };

  const activeAccount = data.accounts.find(a => a.id === activeTab);

  return (
    <div className="min-h-screen">
      <header className="gradient-header sticky top-0 z-40">
        <div className="max-w-6xl mx-auto px-4 py-3">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="gold-bg text-black font-bold text-xs px-2.5 py-1 rounded-lg">연금·ISA</div>
              <div>
                <div className="text-white font-bold text-sm hidden sm:block">포트폴리오 & 매수 툴</div>
                <div className="text-gray-500 text-xs hidden sm:block">유앤김 자산관리</div>
              </div>
            </div>
            <div className="flex items-center gap-2">
              {syncStatus && (
                <div className={`text-xs px-3 py-1 rounded-full ${syncStatus.type === 'error' ? 'bg-red-950 text-red-300' : syncStatus.type === 'success' ? 'bg-green-950 text-green-300' : 'bg-gray-800 text-gray-400'}`}>
                  {syncStatus.msg}
                </div>
              )}
              <button onClick={handleSaveGist} disabled={saving} className="sync-btn text-xs px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
                <span>{saving ? '저장 중...' : '☁ Gist 저장'}</span>
              </button>
              <button onClick={() => setEditMode(v => !v)} className={`text-xs px-3 py-1.5 rounded-lg transition-colors border ${editMode ? 'border-amber-500 text-amber-400 bg-amber-950' : 'border-gray-700 text-gray-400'}`}>
                {editMode ? '✓ 편집모드' : '편집'}
              </button>
              <button onClick={() => setShowSettings(true)} className="text-xs px-3 py-1.5 rounded-lg border border-gray-700 text-gray-400 hover:text-white transition-colors">⚙</button>
            </div>
          </div>
          <div className="flex gap-1 mt-3 overflow-x-auto pb-0.5">
            {TABS.map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2 text-sm font-medium rounded-t-lg transition-all whitespace-nowrap ${activeTab === tab.id ? 'tab-active' : 'tab-inactive'}`}>
                {tab.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-6">
        {activeTab === 'dashboard' && <Dashboard data={data} prices={prices} />}
        {activeAccount && (
          <AccountTab account={activeAccount} prices={prices} onPriceChange={handlePriceChange} editMode={editMode} onEdit={setEditAccount} />
        )}
        {editMode && activeTab === 'dashboard' && (
          <div className="mt-4 p-4 card border-amber-900 border">
            <div className="flex items-center justify-between">
              <p className="text-sm text-amber-400">편집 모드 활성화 — 각 계좌 탭에서 포트폴리오를 수정할 수 있습니다.</p>
              <button onClick={handleReset} className="text-xs text-red-400 hover:text-red-300 border border-red-900 px-3 py-1.5 rounded-lg">초기값으로 리셋</button>
            </div>
          </div>
        )}
      </main>

      {editAccount && <EditModal account={editAccount} onSave={handleEditSave} onClose={() => setEditAccount(null)} />}
      {showSettings && (
        <SettingsModal gistConfig={gistConfig} onSave={handleSaveSettings} onClose={() => setShowSettings(false)}
          onSync={handleLoadGist} syncStatus={syncStatus} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- ===================== 100세 캐시플로우 연동 (cashflow-hub-api) ===================== -->
<button id="cfhubBtn" onclick="exportIrpToCashflow()"
 title="100세 캐시플로우 IRP 탭으로 내보내기"
 style="position:fixed;right:16px;bottom:16px;z-index:9999;padding:11px 16px;border:none;border-radius:999px;
 background:linear-gradient(135deg,#c9a227,#f0c968);color:#1a1405;font-weight:700;font-size:13px;cursor:pointer;
 box-shadow:0 6px 20px rgba(201,162,39,.45);font-family:'Noto Sans KR',sans-serif">🔗 캐시플로우 내보내기</button>
<script>
const CFHUB_API='https://cashflow-hub-api.yjjn2005.workers.dev';
const CFHUB_PIN_KEY='cfhub_pin';
function cfhubGetPin(){
  let p=localStorage.getItem(CFHUB_PIN_KEY);
  if(!p){
    p=prompt('100세 캐시플로우 동기화 PIN을 입력하세요 (캐시플로우 앱과 동일)');
    if(p&&p.trim().length>=4)localStorage.setItem(CFHUB_PIN_KEY,p.trim());
    else return null;
  }
  return localStorage.getItem(CFHUB_PIN_KEY);
}
async function exportIrpToCashflow(){
  const lastP=localStorage.getItem('cfhub_irp_principal')||'80000';
  const pIn=prompt('캐시플로우 [IRP연금]에 반영할 IRP 평가액(만원)을 입력하세요.\n예: 8억 = 80000',lastP);
  if(pIn===null)return;
  const principal=Math.round(parseFloat(pIn));
  if(isNaN(principal)||principal<=0){alert('금액이 올바르지 않습니다');return;}
  const lastR=localStorage.getItem('cfhub_irp_rate')||'4';
  const rIn=prompt('연 운용수익률(%)을 입력하세요',lastR);
  if(rIn===null)return;
  const ratePct=parseFloat(rIn);
  if(isNaN(ratePct)||ratePct<-10||ratePct>30){alert('수익률이 올바르지 않습니다');return;}
  const pin=cfhubGetPin(); if(!pin)return;
  try{
    const res=await fetch(CFHUB_API+'/feed/'+encodeURIComponent(pin)+'/irp',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({principal:principal,rate:Math.round(ratePct*10)/1000,src:'pension-portfolio'})});
    if(!res.ok)throw new Error(res.status);
    localStorage.setItem('cfhub_irp_principal',String(principal));
    localStorage.setItem('cfhub_irp_rate',String(ratePct));
    alert('✅ 캐시플로우로 내보냈습니다\n(원금 '+principal.toLocaleString('ko-KR')+'만 · 수익률 '+ratePct+'%)');
  }catch(e){
    alert('❌ 내보내기 실패 — 네트워크/PIN 확인');
    localStorage.removeItem(CFHUB_PIN_KEY);
  }
}
</script>
</body>
</html>
