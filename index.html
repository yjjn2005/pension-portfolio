function loadLocal(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function saveLocal(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

async function fetchGist(token, gistId) {
  const r = await fetch(`https://api.github.com/gists/${gistId}`, {
    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (!r.ok) throw new Error('Gist 불러오기 실패');
  const d = await r.json();
  const file = d.files['pension_data.json'];
  if (!file) throw new Error('pension_data.json 파일 없음');
  return JSON.parse(file.content);
}

async function saveGist(token, gistId, data) {
  const body = { files: { 'pension_data.json': { content: JSON.stringify(data, null, 2) } } };
  if (gistId) {
    const r = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH', headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('Gist 저장 실패');
    return gistId;
  } else {
    const r = await fetch('https://api.github.com/gists', {
      method: 'POST', headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: '연금·ISA 포트폴리오 데이터', public: false, ...body })
    });
    if (!r.ok) throw new Error('Gist 생성 실패');
    const d = await r.json();
    return d.id;
  }
}

function EditModal({ account, onSave, onClose }) {
  const [etfs, setEtfs] = useState(account.etfs.map(e => ({...e})));
  const [monthly, setMonthly] = useState(account.monthly);
  const total = etfs.reduce((s, e) => s + Number(e.ratio || 0), 0);

  const update = (i, key, val) => setEtfs(prev => prev.map((e, j) => j === i ? {...e, [key]: key === 'ratio' || key === 'monthly' ? Number(val) : val} : e));

  const handleSave = () => {
    const updated = etfs.map(e => ({...e, monthly: Math.round(monthly * e.ratio / 100)}));
    onSave({...account, monthly: Number(monthly), etfs: updated});
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="card card-glow w-full max-w-2xl max-h-screen overflow-y-auto p-6">
        <div className="flex items-center justify-between mb-5">
          <h2 className="text-lg font-bold text-white">{account.name} 포트폴리오 편집</h2>
          <button onClick={onClose} className="text-gray-500 hover:text-white text-xl">✕</button>
        </div>
        <div className="mb-4">
          <label className="text-xs text-gray-500 block mb-1">월 납입액 (원)</label>
          <input type="number" value={monthly} onChange={e => setMonthly(e.target.value)} className="price-input w-48" />
        </div>
        <div className="space-y-3 mb-5">
          {etfs.map((etf, i) => (
            <div key={i} className="bg-gray-950 border border-gray-800 rounded-lg p-3 space-y-2">
              <div className="flex items-center gap-2 text-sm font-medium text-white">
                <span className="text-gray-500 w-4">{i+1}</span>
                <input value={etf.name} onChange={e => update(i, 'name', e.target.value)} className="bg-transparent border-b border-gray-700 focus:border-amber-500 outline-none text-white flex-1 px-1" />
              </div>
              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="text-xs text-gray-500">코드</label>
                  <input value={etf.code} onChange={e => update(i, 'code', e.target.value)} className="price-input text-left mt-0.5" />
                </div>
                <div>
                  <label className="text-xs text-gray-500">운용사</label>
                  <input value={etf.company} onChange={e => update(i, 'company', e.target.value)} className="price-input text-left mt-0.5" />
                </div>
                <div>
                  <label className="text-xs text-gray-500">비중(%)</label>
                  <input type="number" value={etf.ratio} onChange={e => update(i, 'ratio', e.target.value)} className="price-input mt-0.5" />
                </div>
              </div>
              <div>
                <label className="text-xs text-gray-500">역할·투자포인트</label>
                <input value={etf.role} onChange={e => update(i, 'role', e.target.value)} className="price-input text-left mt-0.5" />
              </div>
            </div>
          ))}
        </div>
        <div className={`text-sm mb-4 ${Math.abs(total - 100) < 0.1 ? 'text-green-400' : 'text-red-400'}`}>
          비중 합계: {total}% {Math.abs(total - 100) > 0.1 ? '(100%가 되어야 합니다)' : '✓'}
        </div>
        <div className="flex gap-3">
          <button onClick={handleSave} disabled={Math.abs(total-100) > 0.1} className="flex-1 py-2.5 rounded-lg font-semibold text-black gold-bg disabled:opacity-40">저장</button>
          <button onClick={onClose} className="flex-1 py-2.5 rounded-lg font-semibold text-gray-400 bg-gray-900 border border-gray-700">취소</button>
        </div>
      </div>
    </div>
  );
}

        <div className="flex gap-3">
          <button onClick={() => onSave({token, gistId})} className="flex-1 py-2.5 rounded-lg font-semibold text-black gold-bg">저장</button>
          {token && <button onClick={() => onSync(token, gistId)} className="flex-1 py-2.5 rounded-lg font-semibold sync-btn">Gist에서 불러오기</button>}

        <p><GNum>2단계.</GNum> 그 달에 살 ETF가 이미 목록에 들어 있습니다. 종목마다 <b>목표 비중</b>(전체 중 몇 %를 이 종목으로 살지)이 정해져 있습니다. 비중은 본인 계획에 맞게 바꿀 수 있습니다.</p>
        <p><GNum>3단계.</GNum> 매수하기 직전, 각 ETF 칸의 <b>시장가격</b>에 지금 가격을 입력합니다. 증권사 앱에서 현재가를 보고 그대로 적으면 됩니다.</p>
        <p><GNum>4단계.</GNum> 그러면 앱이 '이번 달 납입액으로 종목별로 몇 주를 사면 되는지'를 자동으로 계산해 줍니다. 그대로 증권사 앱에서 주문하면 끝입니다.</p>
      </GCard>

      <GCard title="4. 매달 하는 일 (매수일 루틴)">
        <p>① 계좌에 이번 달 돈을 넣습니다 → ② 이 앱을 열어 시장가격을 입력합니다 → ③ 계산된 수량대로 매수합니다 → ④ 끝. 한 달에 5분이면 충분합니다.</p>
        <p>주가가 올랐다고 더 사거나, 내렸다고 덜 사지 않는 것이 적립식의 핵심입니다. 매달 같은 금액으로 사는 것 자체가 전략입니다('왜 투자?' 탭 참고).</p>
      </GCard>

      <GCard title="5. 휴대폰과 PC에서 함께 쓰기 (동기화)">
        <p>이 기능은 선택 사항입니다. 설정하지 않아도 한 기기에서는 그대로 쓸 수 있습니다.</p>
        <p>입력 내용은 기기 안에만 저장되므로, 휴대폰에서 적은 내용이 PC에 자동으로 따라가지는 않습니다. 동기화를 켜 둔 경우에는 상단 'Gist 저장' 버튼을 눌러 올리고, 다른 기기에서는 '불러오기'를 눌러 받는 수동 방식입니다(자동 백업이 아닙니다). 설정에는 GitHub의 열쇠(토큰)가 필요하니, 처음 한 번은 <b>이 앱을 알려 준 사람과 함께 안전한 방법으로 설정</b>하는 것을 권합니다.</p>
        <GNote>동기화에 쓰이는 열쇠는 집 열쇠와 같습니다. 문자·카톡으로 다른 사람에게 보내지 마세요.</GNote>
      </GCard>

      <GCard title="6. 캐시플로우보내기">
        <p>맨 위 '캐시플로우보내기' 버튼은 '100세 캐시플로우' 앱으로 연금 납입 계획을 보내는 기존 기능입니다. 그 앱을 함께 쓰는 경우에만 필요하고, PIN(암호)은 캐시플로우 앱의 것과 같습니다. 쓰지 않는다면 누르지 않아도 됩니다.</p>
      </GCard>

      <GCard title="7. 주의할 점">
        <p>· 브라우저에서 이 사이트의 데이터를 지우면(사이트 데이터 삭제·앱 초기화) 입력 내용이 사라집니다. 중요하면 동기화를 켜고 'Gist 저장'을 눌러 두세요(버튼을 눌러야 저장됩니다).</p>
        <p>· 이 앱은 매수 '계산'만 도와줄 뿐 실제 주문은 증권사 앱에서 직접 합니다.</p>
        <p>· 세액공제 예상액은 입력값에 따른 참고용 계산이며, 실제 환급액은 그해 소득과 세법에 따라 달라집니다.</p>
      </GCard>
    </div>
  );
}

function GuideEasy() {
  return (
    <div>
      <div className="mb-5">
        <h2 className="text-white font-bold text-lg">개인연금 · IRP · ISA, 아주 쉬운 설명</h2>
        <p className="text-gray-500 text-xs mt-1">어려운 말은 나올 때마다 바로 풀어서 설명합니다. 2026년 현행 제도 기준입니다.</p>
      </div>

      <GCard title="0. 먼저, 세 계좌의 공통점과 차이 하나씩">
        <p>셋 다 '세금을 덜 내게 해 주는 통장'입니다. 같은 ETF를 사더라도 이 통장들 안에서 사면 세금 부담이 줄어듭니다.</p>
        <p>다만 덜어 주는 방식이 둘로 나뉩니다. 연금저축·IRP는 <b>넣을 때</b> 낼 세금에서 돌려주는 방식이라, 그 해에 낸 세금이 있어야 의미가 있습니다. ISA는 계좌 안에서 <b>번 돈의</b> 세금을 덜어 주는 방식이라, 낸 세금이 없는 사람도 수익이 나면 혜택을 받습니다.</p>
      </GCard>

      <GCard title="1. 연금저축 (개인연금)">
        <p>소득·나이와 관계없이 <b>누구나</b> 가입할 수 있습니다. 소득이 없는 주부나 미성년 자녀 이름으로도 만들 수 있습니다.</p>
        <p>· <GNum>세금 혜택</GNum>: 1년에 넣은 돈 중 <b>600만 원까지</b> 세액공제 대상입니다. '세액공제'는 낼 세금에서 그만큼을 빼 준다는 뜻입니다. 공제율은 소득에 따라 16.5%(총급여 5,500만 원 이하) 또는 13.2%이고, 돌려받는 금액은 그 해에 실제로 낸 세금을 넘지 못합니다.</p>
        <p>· 예시: 총급여 5,500만 원 이하 직장인이 1년에 600만 원을 넣고 낼 세금이 충분하다면, 연말정산에서 최대 99만 원을 돌려받는 식입니다.</p>
        <p>· 낸 세금이 없으면 돌려받을 것도 없고, 소득이 있어 세금을 냈다면 그 안에서 돌려받을 수 있습니다. 자녀 명의 계좌는 보통 환급보다 '일찍 시작하는 투자 통장'의 의미가 큽니다.</p>
        <p>· <GNum>꺼내 쓰는 조건</GNum>: 만 55세 이상이고 가입 후 5년이 지나야 연금으로 받기 시작할 수 있습니다. 연금으로 받으면 낮은 연금소득세(나이에 따라 3.3~5.5%)를 냅니다.</p>
        <p>· <GNum>그 전에 꺼내면</GNum>: 세액공제를 <b>받은</b> 납입금과 불어난 수익에는 16.5%의 세금(기타소득세)이 붙습니다. 반대로 세액공제를 <b>받지 않고</b> 넣은 원금은 금융사 확인을 거치면 세금 없이 꺼낼 수 있습니다.</p>
      </GCard>

      <GCard title="2. IRP (개인형 퇴직연금)">
        <p>가입 대상이 정해져 있습니다. 금융감독원 안내 기준으로 ① 퇴직연금(DB·DC형)에 가입된 직장인, ② 퇴직금을 IRP로 받아 운용하려는 사람, ③ 자영업자·공무원 등 직역연금 가입자입니다. 퇴직금을 IRP로 받았다면 퇴직 후 소득이 없는 시기에도 그대로 운용할 수 있고, 실제 개설은 금융사에서 가입 자격을 확인합니다.</p>
        <p>· <GNum>세금 혜택</GNum>: 연금저축과 합쳐서 1년에 <b>900만 원까지</b> 세액공제 대상입니다. 연금저축 600만 원을 다 채웠다면 IRP로 300만 원을 더 넣어 900만 원을 채우는 식입니다.</p>
        <p>· 예시: 900만 원을 다 채우면 16.5% 구간은 최대 148만 5천 원, 13.2% 구간은 최대 118만 8천 원까지 돌려받을 수 있습니다(역시 실제 낸 세금 안에서).</p>
        <p>· <GNum>꺼내 쓰는 조건</GNum>: 원칙은 연금저축과 같이 만 55세 이상 + 가입 5년 경과입니다. 다만 퇴직금을 이 계좌에 보관했다가 연금으로 받는 경우에는 가입 5년 조건을 따로 보지 않는 예외가 있습니다(국세청 안내).</p>
        <p>· 중도 인출은 연금저축보다 규칙이 더 까다로워 원칙적으로 안 됩니다(법으로 정한 부득이한 사유만 예외). 당분간 쓸 돈은 넣지 않는 것이 좋습니다.</p>
      </GCard>

      <GCard title="3. ISA (개인종합자산관리계좌)">
        <p>만 19세 이상 거주자, 또는 일해서 번 소득이 있는 만 15~18세가 가입할 수 있습니다. 다만 최근 3년 안에 금융소득종합과세(이자·배당 합계 연 2,000만 원 초과) 대상이었던 사람은 제외됩니다.</p>
        <p>· <GNum>세금 혜택</GNum>: 넣은 돈에 혜택을 주는 게 아니라 <b>번 돈의 세금</b>을 덜어 줍니다. 계좌 안에서 종목별로 번 돈과 잃은 돈을 합산(손익통산)한 순수익 중 200만 원(서민형은 400만 원)까지 세금이 없습니다.</p>
        <p>· 비과세 한도(일반형 200만 원, 서민형 400만 원)를 넘는 부분은 9.9%만 냅니다. 참고로 이자·배당 같은 과세 대상 소득은 일반 계좌에서 15.4%를 내니, 그런 수익 기준으로는 세율이 낮습니다. (원래 세금이 없는 국내 주식 매매차익 같은 수익은 이 혜택과 관계없이 같습니다.)</p>
        <p>· <GNum>한도</GNum>: 1년에 2,000만 원, 계좌 총 납입한도 1억 원까지 넣을 수 있고, 올해 다 쓰지 못한 연간 한도는 다음 해로 이월됩니다. 최소 3년은 유지해야 혜택을 온전히 받습니다.</p>
        <p>· <GNum>숨은 혜택</GNum>: 만기(또는 의무기간 후 해지)로 받은 돈을 60일 안에 연금저축이나 IRP로 옮기면, 옮긴 돈의 10%를 <b>세액공제 대상 금액으로 추가</b> 인정받습니다(최대 300만 원까지). 예를 들어 3,000만 원을 옮기면 그 10%인 300만 원이 세액공제 대상에 추가되고, 공제율 16.5% 구간이면 최대 49만 5천 원을 돌려받는 식입니다(실제 낸 세금 등 조건에 따라 달라집니다).</p>
      </GCard>

      <GCard title="4. 한눈에 비교">
        <p>· 세금 돌려받기(넣을 때): 연금저축 600만 + IRP 합산 900만 한도 / 세금 아끼기(벌 때): ISA 순수익 200~400만 비과세</p>
        <p>· 가입: 연금저축 누구나 · IRP 정해진 대상(직장인·자영업자 등) · ISA 만 19세 이상(15~18세는 근로소득 필요)</p>
        <p>· 묶이는 기간: 연금저축·IRP는 55세·가입 5년 후 연금 수령이 원칙 · ISA 3년</p>
        <p>· 그래서 흔히 '매달 여유 자금으로 연금 계좌 세액공제 한도를 채우고, 중간에 쓸 가능성이 있는 돈은 ISA로' 나눠 생각합니다. 정답이 아니라 많이 쓰는 틀이며, 본인 상황에 따라 달라집니다.</p>
      </GCard>

      <GCard title="5. 세대별로 보면">
        <p>· <GNum>자녀·손자녀(미성년)</GNum>: 연금저축은 법정대리인과 함께 만들 수 있지만, 돌려받을 세금이 없어 환급 혜택은 없습니다. 대신 '일찍 시작하는 복리 통장'이 됩니다('왜 투자?' 탭). ISA는 일해서 번 소득이 있는 만 15세 이상이면 만들 수 있고, IRP는 소득이 생긴 뒤 금융사에서 가입 자격을 확인해 만들 수 있습니다.</p>
        <p>· <GNum>사회초년생</GNum>: 일을 시작해 소득이 생기면 IRP 가입 자격이 생기는 경우가 많습니다. 연금저축부터 시작해 한도를 채워 가는 것이 보통의 순서입니다.</p>
        <p>· <GNum>직장인·자영업자</GNum>: 요건을 갖추면 세 계좌 모두 가능합니다(금융소득종합과세 대상이었던 사람은 ISA는 제외). 세액공제 한도(900만)를 먼저 채우는지 확인하는 것이 출발점입니다.</p>
        <GNote>2026년 현재의 일반적인 제도 설명입니다(금융감독원 통합연금포털·국세청 안내 기준). 정부 세제 개편으로 한도·조건이 바뀔 수 있고, 2026년에도 관련 개편 논의가 진행 중입니다. 가입 전에는 금융사 안내와 금융감독원 통합연금포털(fss.or.kr)에서 최신 기준을 확인하세요. 특정 상품 가입을 권유하는 것이 아닌 제도 설명입니다.</GNote>
      </GCard>
    </div>
  );
}

function GuideWhy() {
  return (
    <div>
      <div className="mb-5">
        <h2 className="text-white font-bold text-lg">왜 일찍, 적립식으로, 미국 지수에?</h2>
        <p className="text-gray-500 text-xs mt-1">이 포트폴리오가 어떤 생각으로 만들어졌는지, 이유를 설명합니다.</p>
      </div>

      <GCard title="1. 왜 '시장 전체에, 길게' 투자하나">
        <p>주식시장에는 기업이 모여 있고, 기업은 이익을 내기 위해 일합니다. 사람들이 일하고, 기술이 발전하고, 소비가 이어지는 한 경제는 길게 보면 커 왔습니다. 지수(시장 전체를 담은 바구니)에 투자한다는 것은 개별 기업 한 곳이 아니라 <b>그 성장 전체에 올라타는 것</b>입니다.</p>
        <p>다만 '오른쪽 위로 곧장'은 절대 아닙니다. 2008년 금융위기, 2020년 코로나, 2022년 금리 인상처럼 미국 지수도 크게 내렸고, 회복에는 몇 년이 걸리기도 했습니다. 일본 주식시장처럼 1989년 고점을 30년 넘게 회복하지 못한 시장도 있습니다. 그래서 이 전략은 <b>10년 이상 묵혀 둘 돈</b>이 전제이고, 그럼에도 손실이 남을 수 있습니다. 단기에 오를 것을 기대하는 돈이라면 맞지 않습니다.</p>
        <GNote>이 탭의 내용은 전부 제도와 개념의 설명이며, 개인의 상황에 맞는 매수 권유가 아닙니다.</GNote>
      </GCard>

      <GCard title="2. 복리: 눈덩이가 굴러가는 이유">
        <p>복리는 '이자가 이자를 낳는' 구조입니다. 처음에는 원금만 불어나지만, 시간이 지나면 불어난 이익이 다시 이익을 만들어 곡선이 점점 가팔라집니다.</p>
        <p>· 가정 예시(연 7%로 불어난다고 <b>가정</b>한 계산이며 보장이 아닙니다): 매달 30만 원씩 넣으면 10년 뒤 약 5,200만 원, 20년 뒤 약 1억 6천만 원, 30년 뒤 약 3억 7천만 원, 40년 뒤 약 7억 9천만 원이 됩니다. 넣은 원금은 각각 3,600만·7,200만·1억 800만·1억 4,400만 원입니다.</p>
        <p>· 이 예시에서 눈여겨볼 것은 30년과 40년의 차이입니다. 원금은 3,600만 원 더 넣었을 뿐인데 결과는 4억 원 넘게 벌어집니다. 같은 가정 수익률에서는 <b>기간이 길수록 불어나는 속도가 빨라진다</b>는 것이 복리의 성질입니다.</p>
        <p>· 비교해 볼 수 있는 예시 하나 더(같은 연 7% 가정): 월 33만 원을 30년 넣으면 약 4억 원, 월 30만 원을 40년 넣으면 약 7억 9천만 원입니다. 이 가정에서는 10년 더 일찍 시작한 쪽이 매달 3만 원을 더 넣는 것보다 훨씬 큽니다. 자녀·손자녀의 연금이 어른보다 긴 시간을 품고 시작하는 이유입니다.</p>
        <GNote>연 7%는 이해를 위한 가정 숫자입니다. 실제로는 오르는 해도, 내리는 해도 있으며 물가 상승도 고려하지 않았습니다. 수익률 가정이 달라지면 결과도 크게 달라집니다.</GNote>
      </GCard>

      <GCard title="3. 왜 '매달 조금씩(적립식)'인가">
        <p>큰돈을 한 번에 넣으면 '지금이 고점이면 어떡하지'라는 고민에 갇힙니다. 적립식은 매달 같은 금액으로 사기 때문에, 주가가 쌀 때는 같은 돈으로 <b>더 많이</b> 사고 비쌀 때는 <b>덜</b> 사게 됩니다. 결과적으로 매수 가격이 평균으로 모이고, 타이밍을 재려다 기회를 놓치는 실수를 피할 수 있습니다.</p>
        <p>무엇보다 좋은 점은 <b>감정을 배제</b>할 수 있다는 것입니다. 폭락장에서 계획을 멈추는 것이 장기 투자에서 흔한 실패 중 하나입니다. '매달 같은 날, 같은 금액'이라는 규칙은 그 실패를 막는 안전장치입니다.</p>
      </GCard>

      <GCard title="4. 왜 미국 지수인가">
        <p>· 미국은 세계에서 가장 큰 주식시장이고, 전 세계에서 돈을 버는 글로벌 기업들이 모여 있습니다. 미국 지수를 사면 미국만 사는 게 아니라 <b>세계 경제의 가장 큰 축</b>을 사는 셈입니다.</p>
        <p>· 미국 대표 지수는 오랜 기간 우상향해 온 것으로 잘 알려져 있습니다. 다만 그것은 과거의 기록이며 미래를 보장하지 않고, 앞의 1번에서 말한 큰 하락도 그 안에 포함되어 있습니다.</p>
        <p>· 한국 자산만 들고 있으면 집·예금·연금이 모두 원화에 몰립니다. 미국 지수는 자산의 일부를 <b>달러와 해외 경제에 나눠 담는</b> 분산의 역할도 합니다.</p>
        <p>· 모든 사람에게 미국 지수가 맞는 것은 아닙니다. 이 포트폴리오가 택한 방향의 이유를 설명하는 것이고, 본인에게 맞는지는 각자 판단할 일입니다.</p>
      </GCard>

      <GCard title="5. 왜 '환율 그대로(언헤지드)' 상품인가">
        <p>국내에 상장된 미국 지수 ETF에는 '헤지(환율 변동을 막은)' 버전과 '언헤지드(막지 않은)' 버전이 있습니다. 이 포트폴리오는 언헤지드, 즉 환율을 그대로 타는 버전을 담습니다. 이유는 세 가지입니다.</p>
        <p>· <GNum>비용</GNum>: 헤지에는 비용이 따릅니다. 다만 그 크기는 두 나라의 금리 차 등에 따라 시기마다 크게 달라져서, 얼마라고 단정할 수 없고 비용이 아주 작거나 오히려 유리한 시기도 있습니다. 오래 들고 갈수록 이 비용의 누적이 결과에 영향을 줍니다.</p>
        <p>· <GNum>양방향</GNum>: 환율은 오르기도 하고 내리기도 합니다. 원화 가치가 떨어지면(환율 상승) 달러 자산의 원화 환산액이 늘어 주가 하락의 일부를 메워 주고, 반대로 원화 가치가 오르면 환산액이 깎입니다. 어느 쪽이든 크게 움직일 수 있고, 오래 들고 간다고 반드시 상쇄되는 것도 아닙니다. 이 포트폴리오는 그 변동 자체를 받아들이는 선택입니다.</p>
        <p>· <GNum>분산 그 자체</GNum>: 언헤지드는 '달러를 들고 있는 것'이기도 합니다. 원화 자산과 성격이 다른 자산을 섞는 것 자체가 이 포트폴리오의 의도입니다.</p>
        <p>· 반대로 헤지 상품이 나은 경우도 있습니다. 특히 짧은 기간에는 환율 하락이 수익률을 크게 깎을 수 있습니다. '오래 묵힐 돈'이라는 전제가 있을 때의 선택입니다.</p>
      </GCard>

      <GCard title="6. 마지막으로 한 가지만">
        <p>주가는 오르기만 하지 않습니다. 원금의 상당 부분을 잃는 시기가 올 수 있고, 시장과 기간에 따라서는 되찾지 못할 수도 있습니다. 여기 나온 수익률 숫자는 모두 과거의 기록이거나 이해를 위한 가정입니다. 큰 결정은 가족과 상의하고, 필요하면 전문가 상담도 받아 보세요.</p>
      </GCard>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState(() => { const h = (location.hash || '').slice(1); return ['dashboard','pension1','pension2','irp','isa','manual','easy','why'].includes(h) ? h : 'dashboard'; });
  const [data, setData] = useState(() => { const d = loadLocal(DATA_KEY, INITIAL_DATA); if (d.title === '연금·ISA 통합 포트폴리오') d.title = INITIAL_DATA.title; return d; });
  const [prices, setPrices] = useState(() => loadLocal(PRICE_KEY, {}));
  const [gistConfig, setGistConfig] = useState(() => loadLocal(GIST_KEY, {}));
  const [showSettings, setShowSettings] = useState(false);
  const [editAccount, setEditAccount] = useState(null);
  const [editMode, setEditMode] = useState(false);
  const [syncStatus, setSyncStatus] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(() => { saveLocal(DATA_KEY, data); }, [data]);
  useEffect(() => { saveLocal(PRICE_KEY, prices); }, [prices]);
  useEffect(() => { const el = document.getElementById('tabbtn-' + activeTab); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'auto', inline: 'center', block: 'nearest' }); }, [activeTab]);

  const handlePriceChange = useCallback((code, val) => {
    setPrices(prev => ({...prev, [code]: Number(val) || 0}));
  }, []);

  const copyAppUrl = async () => {
    const url = location.origin + location.pathname;
    const legacy = () => {
      const t = document.createElement('textarea');
      t.value = url; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
      return ok;
    };
    let ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(url); ok = true; } } catch (e) {}
    if (!ok) ok = legacy();
    setSyncStatus(ok ? {type: 'success', msg: '✓ 앱 주소를 복사했습니다'} : {type: 'error', msg: '복사가 안 되면 주소창을 길게 눌러 직접 복사해 주세요'});
    setTimeout(() => setSyncStatus(null), 3000);
  };

  const handleSaveGist = async () => {
    if (!gistConfig.token) { setShowSettings(true); return; }
    setSaving(true);
    setSyncStatus({type: 'info', msg: 'Gist에 저장 중...'});
    try {
      const payload = { data, prices, savedAt: new Date().toISOString() };
      const newId = await saveGist(gistConfig.token, gistConfig.gistId, payload);
      if (newId !== gistConfig.gistId) {
        const nc = {...gistConfig, gistId: newId};
        setGistConfig(nc); saveLocal(GIST_KEY, nc);
      }
      setSyncStatus({type: 'success', msg: `✓ Gist 저장 완료 (ID: ${newId.slice(0,8)}...)`});
    } catch(e) { setSyncStatus({type: 'error', msg: '저장 실패: ' + e.message}); }
    setSaving(false);
    setTimeout(() => setSyncStatus(null), 4000);
  };

  const handleLoadGist = async (token, gistId) => {
    if (!gistId) { setSyncStatus({type: 'error', msg: 'Gist ID를 먼저 입력해주세요.'}); return; }
    setSyncStatus({type: 'info', msg: 'Gist에서 불러오는 중...'});
    try {
      const payload = await fetchGist(token, gistId);
      if (payload.data) { if (payload.data.title === '연금·ISA 통합 포트폴리오') payload.data.title = INITIAL_DATA.title; setData(payload.data); saveLocal(DATA_KEY, payload.data); }
      if (payload.prices) { setPrices(payload.prices); saveLocal(PRICE_KEY, payload.prices); }
      setSyncStatus({type: 'success', msg: `✓ 동기화 완료 (${payload.savedAt ? new Date(payload.savedAt).toLocaleString('ko-KR') : ''})`});
    } catch(e) { setSyncStatus({type: 'error', msg: '불러오기 실패: ' + e.message}); }
  };

  const handleSaveSettings = (cfg) => {
    setGistConfig(cfg); saveLocal(GIST_KEY, cfg);
    setSyncStatus({type: 'success', msg: '설정이 저장되었습니다.'});
    setShowSettings(false);
    setTimeout(() => setSyncStatus(null), 3000);
  };

  const handleEditSave = (updated) => {
    setData(prev => ({...prev, accounts: prev.accounts.map(a => a.id === updated.id ? updated : a)}));
    setEditAccount(null);
  };

  const handleReset = () => {
    if (confirm('포트폴리오를 초기값으로 되돌리시겠습니까?')) { setData(INITIAL_DATA); saveLocal(DATA_KEY, INITIAL_DATA); }
  };

  const activeAccount = data.accounts.find(a => a.id === activeTab);

  return (
    <div className="min-h-screen">
      <header className="gradient-header sticky top-0 z-40">
        <div className="max-w-6xl mx-auto px-4 py-3">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="gold-bg text-black font-bold text-xs px-2.5 py-1 rounded-lg">연금·IRP·ISA</div>
              <div>
                <div className="text-white font-bold text-sm hidden sm:block">포트폴리오 및 매수 툴</div>
                <div className="text-gray-500 text-xs hidden sm:block">유앤김 자산관리</div>
              </div>
            </div>
            <div className="flex items-center gap-2">
              {syncStatus && (
                <div className={`text-xs px-3 py-1 rounded-full ${syncStatus.type === 'error' ? 'bg-red-950 text-red-300' : syncStatus.type === 'success' ? 'bg-green-950 text-green-300' : 'bg-gray-800 text-gray-400'}`}>
                  {syncStatus.msg}
                </div>
              )}
              <button onClick={handleSaveGist} disabled={saving} className="sync-btn text-xs px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5">
                <span>{saving ? '저장 중...' : '☁ Gist 저장'}</span>
              </button>
              <button onClick={() => setEditMode(v => !v)} className={`text-xs px-3 py-1.5 rounded-lg transition-colors border ${editMode ? 'border-amber-500 text-amber-400 bg-amber-950' : 'border-gray-700 text-gray-400'}`}>
                {editMode ? '✓ 편집모드' : '편집'}
              </button>
              <button onClick={copyAppUrl} className="text-xs px-3 py-1.5 rounded-lg border border-gray-700 text-gray-400 hover:text-white transition-colors">주소 복사</button>
              <button onClick={() => setShowSettings(true)} className="text-xs px-3 py-1.5 rounded-lg border border-gray-700 text-gray-400 hover:text-white transition-colors">⚙</button>
            </div>
          </div>
          <div className="flex gap-1 mt-3 overflow-x-auto pb-0.5 pr-16 tabrow-mask">
            {TABS.map(tab => (
              <button key={tab.id} id={'tabbtn-' + tab.id} onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2 text-sm font-medium rounded-t-lg transition-all whitespace-nowrap ${activeTab === tab.id ? 'tab-active' : 'tab-inactive'}`}>
                {tab.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-6">
        {activeTab === 'dashboard' && <Dashboard data={data} prices={prices} />}
        {activeTab === 'manual' && <GuideManual />}
        {activeTab === 'easy' && <GuideEasy />}
        {activeTab === 'why' && <GuideWhy />}
        {activeAccount && (
          <AccountTab account={activeAccount} prices={prices} onPriceChange={handlePriceChange} editMode={editMode} onEdit={setEditAccount} />
        )}
        {editMode && activeTab === 'dashboard' && (
          <div className="mt-4 p-4 card border-amber-900 border">
            <div className="flex items-center justify-between">
              <p className="text-sm text-amber-400">편집 모드 활성화 — 각 계좌 탭에서 포트폴리오를 수정할 수 있습니다.</p>
              <button onClick={handleReset} className="text-xs text-red-400 hover:text-red-300 border border-red-900 px-3 py-1.5 rounded-lg">초기값으로 리셋</button>
            </div>
          </div>
        )}
      </main>

      <footer className="max-w-6xl mx-auto px-4 pb-10 text-center text-xs text-gray-500">최종 업데이트: 2026-11-24</footer>

      {editAccount && <EditModal account={editAccount} onSave={handleEditSave} onClose={() => setEditAccount(null)} />}
      {showSettings && (
        <SettingsModal gistConfig={gistConfig} onSave={handleSaveSettings} onClose={() => setShowSettings(false)}
          onSync={handleLoadGist} syncStatus={syncStatus} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- ===================== 100세 캐시플로우 연동 (cashflow-hub-api) ===================== -->
<button id="cfhubBtn" onclick="exportIrpToCashflow()"
 title="100세 캐시플로우 IRP 탭으로 내보내기"
 style="position:fixed;right:16px;bottom:16px;z-index:9999;padding:11px 16px;border:none;border-radius:999px;
 background:linear-gradient(135deg,#c9a227,#f0c968);color:#1a1405;font-weight:700;font-size:13px;cursor:pointer;
 box-shadow:0 6px 20px rgba(201,162,39,.45);font-family:'Noto Sans KR',sans-serif">🔗 캐시플로우 내보내기</button>
<script>
const CFHUB_API='https://cashflow-hub-api.yjjn2005.workers.dev';
const CFHUB_PIN_KEY='cfhub_pin';
function cfhubGetPin(){
  let p=localStorage.getItem(CFHUB_PIN_KEY);
  if(!p){
    p=prompt('100세 캐시플로우 동기화 PIN을 입력하세요 (캐시플로우 앱과 동일)');
    if(p&&p.trim().length>=4)localStorage.setItem(CFHUB_PIN_KEY,p.trim());
    else return null;
  }
  return localStorage.getItem(CFHUB_PIN_KEY);
}
async function exportIrpToCashflow(){
  const lastP=localStorage.getItem('cfhub_irp_principal')||'60000';
  const pIn=prompt('캐시플로우 [IRP연금]에 반영할 IRP 평가액(만원)을 입력하세요.\n예: 6억 = 60000',lastP);
  if(pIn===null)return;
  const principal=Math.round(parseFloat(pIn));
  if(isNaN(principal)||principal<=0){alert('금액이 올바르지 않습니다');return;}
  const lastR=localStorage.getItem('cfhub_irp_rate')||'4';
  const rIn=prompt('연 운용수익률(%)을 입력하세요',lastR);
  if(rIn===null)return;
  const ratePct=parseFloat(rIn);
  if(isNaN(ratePct)||ratePct<-10||ratePct>30){alert('수익률이 올바르지 않습니다');return;}
  const pin=cfhubGetPin(); if(!pin)return;
  try{
    const res=await fetch(CFHUB_API+'/feed/'+encodeURIComponent(pin)+'/irp',{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({principal:principal,rate:Math.round(ratePct*10)/1000,src:'pension-portfolio'})});
    if(!res.ok)throw new Error(res.status);
    localStorage.setItem('cfhub_irp_principal',String(principal));
    localStorage.setItem('cfhub_irp_rate',String(ratePct));
    alert('✅ 캐시플로우로 내보냈습니다\n(원금 '+principal.toLocaleString('ko-KR')+'만 · 수익률 '+ratePct+'%)');
  }catch(e){
    alert('❌ 내보내기 실패 — 네트워크/PIN 확인');
    localStorage.removeItem(CFHUB_PIN_KEY);
  }
}
</script>
</body>
